<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N3 한끝 단어 마스터 앱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-sub: #0f172a;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --primary: #38bdf8;
      --btn-start: #0284c7;
      --btn-start-hover: #0369a1;
      --opt-hover-bg: #1e293b;
      --opt-hover-border: #64748b;
      --badge-bg: #334155;
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --correct-text: #a7f3d0;
      --wrong-bg: #7f1d1d;
      --wrong-border: #ef4444;
      --wrong-text: #fecaca;
      --unknown-bg: #451a03;
      --unknown-border: #f97316;
      --unknown-text: #ffedd5;
    }

    body.theme-light {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-sub: #f8fafc;
      --border-color: #cbd5e1;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --btn-start: #0284c7;
      --btn-start-hover: #0369a1;
      --opt-hover-bg: #f1f5f9;
      --opt-hover-border: #94a3b8;
      --badge-bg: #e2e8f0;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #7f1d1d;
      --unknown-bg: #ffedd5;
      --unknown-border: #ea580c;
      --unknown-text: #7c2d12;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .app-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .nav-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-actions {
      display: flex;
      gap: 6px;
    }
    .nav-btn {
      background-color: var(--badge-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { color: var(--text-main); border-color: var(--text-muted); }
    .screen { display: none; }
    .screen.active { display: block; }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .select-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .select-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .select-item:hover {
      border-color: var(--primary);
    }
    .select-item.selected {
      border-color: var(--primary);
      background-color: rgba(56, 189, 248, 0.12);
    }
    .item-label { font-size: 14px; font-weight: 600; }
    .item-count {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: var(--badge-bg);
      color: var(--text-sub);
      font-weight: 700;
    }
    .start-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: var(--btn-start);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .start-btn:hover { background-color: var(--btn-start-hover); }
    .quiz-progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: var(--bg-sub);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .quiz-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.2s ease;
    }
    .prompt-box {
      text-align: center;
      padding: 16px 8px;
      background-color: var(--bg-sub);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 14px;
    }
    .prompt-type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background-color: var(--badge-bg);
      color: var(--primary);
      margin-bottom: 6px;
    }
    .prompt-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 440px) {
      .options-grid { grid-template-columns: 1fr; }
    }
    .opt-btn {
      min-height: 44px;
      padding: 8px 10px;
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.12s ease;
    }
    .opt-btn:hover:not(:disabled) {
      background-color: var(--opt-hover-bg);
      border-color: var(--opt-hover-border);
    }
    .opt-btn .num {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      min-width: 14px;
    }
    .opt-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: var(--correct-text) !important;
      font-weight: 700;
    }
    .opt-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: var(--wrong-text) !important;
      font-weight: 700;
    }
    .opt-btn.unknown-btn {
      background-color: var(--bg-sub);
      border-color: var(--border-color);
      color: var(--text-sub);
    }
    .opt-btn.selected-unknown {
      background-color: var(--unknown-bg) !important;
      border-color: var(--unknown-border) !important;
      color: var(--unknown-text) !important;
      font-weight: 700;
    }
    .detail-card {
      display: none;
      background-color: var(--bg-sub);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .detail-card.show { display: block; }
    .detail-item {
      display: flex;
      gap: 8px;
      margin-bottom: 2px;
    }
    .detail-label {
      color: var(--text-muted);
      font-weight: 600;
      min-width: 58px;
    }
    .detail-value {
      color: var(--text-main);
      font-weight: 600;
    }
    .detail-value.hanja-meaning {
      color: #f59e0b; /* 한자 훈음 강조 */
    }
    .next-btn {
      display: none;
      width: 100%;
      padding: 12px;
      background: var(--btn-start);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .next-btn:hover { background-color: var(--btn-start-hover); }
    .finish-screen {
      text-align: center;
      padding: 24px 8px;
    }
    .finish-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .finish-desc {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-nav">
    <div class="nav-title">
      <span>📖 JLPT N3 한끝 마스터</span>
    </div>
    <div class="nav-actions">
      <button class="nav-btn" onclick="toggleTheme()" id="themeBtn">🌓 테마</button>
      <button class="nav-btn" onclick="goToSetup()">⚙️ 설정</button>
      <button class="nav-btn" onclick="confirmResetStats()">🔄 초기화</button>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="screen active">
    <div class="section-title">1단계: 학습할 단어장 선택</div>
    <div class="select-grid" id="listSelectionGrid">
      <div class="select-item selected" onclick="selectList('all', this)">
        <span class="item-label">전체 단어 (무작위)</span>
        <span class="item-count" id="countAll">162개</span>
      </div>
      <div class="select-item" onclick="selectList('wrong1', this)">
        <span class="item-label">1회 틀린 단어</span>
        <span class="item-count" id="countW1">0개</span>
      </div>
      <div class="select-item" onclick="selectList('wrong2', this)">
        <span class="item-label">2회 틀린 단어</span>
        <span class="item-count" id="countW2">0개</span>
      </div>
      <div class="select-item" onclick="selectList('wrong3', this)">
        <span class="item-label">3회 이상 틀린 단어</span>
        <span class="item-count" id="countW3">0개</span>
      </div>
    </div>

    <div class="section-title">2단계: 퀴즈 유형 선택</div>
    <div class="select-grid" id="typeSelectionGrid">
      <div class="select-item selected" onclick="selectType(1, this)">
        <span class="item-label">한자/원문 ➔ 발음(히라가나)</span>
      </div>
      <div class="select-item" onclick="selectType(2, this)">
        <span class="item-label">한자/원문 ➔ 한국어 뜻</span>
      </div>
      <div class="select-item" onclick="selectType(3, this)">
        <span class="item-label">발음(히라가나) ➔ 한국어 뜻</span>
      </div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startQuizSession()">학습 시작하기 (셔플)</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="screen">
    <div class="quiz-progress-bar-bg">
      <div class="quiz-progress-bar" id="progressBar"></div>
    </div>

    <div class="prompt-box">
      <div class="prompt-type-badge" id="promptTypeBadge">유형</div>
      <div class="prompt-text" id="promptWord">単語</div>
    </div>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="detail-card" id="detailCard">
      <div class="detail-item"><span class="detail-label">한자</span><span class="detail-value" id="detailKanji"></span></div>
      <div class="detail-item" id="detailHanjaBox"><span class="detail-label">한자훈음</span><span class="detail-value hanja-meaning" id="detailHanjaMeaning"></span></div>
      <div class="detail-item"><span class="detail-label">발음</span><span class="detail-value" id="detailReading"></span></div>
      <div class="detail-item"><span class="detail-label">의미</span><span class="detail-value" id="detailMeaning"></span></div>
    </div>

    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제 ▶</button>
  </div>

  <!-- FINISH SCREEN -->
  <div id="finishScreen" class="screen finish-screen">
    <div class="finish-title">🎉 학습 세션 완료!</div>
    <div class="finish-desc" id="finishSummary">선택한 단어장의 모든 문제를 1회독 완료했습니다.</div>
    <button class="start-btn" onclick="goToSetup()">설정 화면으로 이동</button>
  </div>
</div>

  function getHanjaMeanings(wordStr) {
    const kanjiRegex = /[\u4E00-\u9FAF\u3400-\u4DBF]/g;
    const matches = wordStr.match(kanjiRegex);
    if (!matches || matches.length === 0) return null;

    const parsed = matches.map(char => kanjiDict[char] || `${char}(훈음 미등록)`);
    return `(${parsed.join(', ')})`;
  }

  vocabList.forEach((item, idx) => { item.id = idx; });

  const STORAGE_KEY = "JLPT_N3_WRONG_COUNTS_V4";
  const THEME_KEY = "JLPT_N3_THEME_MODE";
  let wrongCounts = {};

  function loadWrongCounts() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      wrongCounts = data ? JSON.parse(data) : {};
    } catch(e) {
      wrongCounts = {};
    }
  }

  function saveWrongCounts() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(wrongCounts));
    } catch(e) {}
  }

  function getCount(id) {
    return wrongCounts[id] || 0;
  }

  function recordWrong(id) {
    wrongCounts[id] = (wrongCounts[id] || 0) + 1;
    saveWrongCounts();
  }

  // 테마 관리 로직
  function initTheme() {
    const savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === 'light') {
      document.body.classList.add('theme-light');
      document.getElementById('themeBtn').innerText = "☀️ 화이트";
    } else {
      document.body.classList.remove('theme-light');
      document.getElementById('themeBtn').innerText = "🌙 다크";
    }
  }

  function toggleTheme() {
    const isLight = document.body.classList.toggle('theme-light');
    localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
    document.getElementById('themeBtn').innerText = isLight ? "☀️ 화이트" : "🌙 다크";
  }

  let selectedListType = 'all';
  let selectedQuizType = 1;
  let currentPool = [];
  let currentIndex = 0;
  let currentWord = null;

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function updateCountsUI() {
    loadWrongCounts();
    let c1 = 0, c2 = 0, c3 = 0;
    vocabList.forEach(w => {
      const cnt = getCount(w.id);
      if (cnt === 1) c1++;
      else if (cnt === 2) c2++;
      else if (cnt >= 3) c3++;
    });

    document.getElementById("countAll").innerText = `${vocabList.length}개`;
    document.getElementById("countW1").innerText = `${c1}개`;
    document.getElementById("countW2").innerText = `${c2}개`;
    document.getElementById("countW3").innerText = `${c3}개`;
  }

  function selectList(type, el) {
    document.querySelectorAll("#listSelectionGrid .select-item").forEach(item => item.classList.remove("selected"));
    el.classList.add("selected");
    selectedListType = type;
  }

  function selectType(typeNum, el) {
    document.querySelectorAll("#typeSelectionGrid .select-item").forEach(item => item.classList.remove("selected"));
    el.classList.add("selected");
    selectedQuizType = typeNum;
  }

  function startQuizSession() {
    loadWrongCounts();

    if (selectedListType === 'all') {
      currentPool = [...vocabList];
    } else if (selectedListType === 'wrong1') {
      currentPool = vocabList.filter(w => getCount(w.id) === 1);
    } else if (selectedListType === 'wrong2') {
      currentPool = vocabList.filter(w => getCount(w.id) === 2);
    } else if (selectedListType === 'wrong3') {
      currentPool = vocabList.filter(w => getCount(w.id) >= 3);
    }

    if (currentPool.length === 0) {
      alert("선택하신 목록에 해당하는 단어가 없습니다!");
      return;
    }

    currentPool = shuffle(currentPool);
    currentIndex = 0;

    showScreen("quizScreen");
    loadQuestion();
  }

  function showScreen(screenId) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(screenId).classList.add("active");
  }

  function goToSetup() {
    updateCountsUI();
    showScreen("setupScreen");
  }

  function confirmResetStats() {
    if (confirm("모든 오답 누적 기록을 완전히 초기화하시겠습니까?")) {
      wrongCounts = {};
      saveWrongCounts();
      updateCountsUI();
      alert("오답 기록이 초기화되었습니다.");
    }
  }

  function getSmartDistractors(targetWord, quizType) {
    const distractors = [];
    const targetReading = targetWord[1];
    const targetMeaning = targetWord[2];
    const candidates = vocabList.filter(w => w.id !== targetWord.id);

    if (quizType === 1) {
      const sorted = candidates.map(w => {
        let score = 0;
        const r = w[1];
        if (r.length === targetReading.length) score += 4;
        if (r[0] === targetReading[0]) score += 3;
        if (r[r.length - 1] === targetReading[targetReading.length - 1]) score += 2;
        return { word: w, score };
      }).sort((a, b) => b.score - a.score);

      for (let item of sorted) {
        if (!distractors.includes(item.word[1]) && item.word[1] !== targetReading) {
          distractors.push(item.word[1]);
          if (distractors.length >= 6) break;
        }
      }
    } else {
      const endsWithDa = targetMeaning.endsWith("다");
      const isShortNoun = !endsWithDa && targetMeaning.length <= 4;

      const sorted = candidates.map(w => {
        let score = 0;
        const m = w[2];
        if (endsWithDa && m.endsWith("다")) score += 4;
        if (!endsWithDa && !m.endsWith("다")) score += 3;
        if (isShortNoun && m.length <= 4) score += 2;
        return { word: w, score };
      }).sort((a, b) => b.score - a.score + (Math.random() - 0.5));

      for (let item of sorted) {
        if (!distractors.includes(item.word[2]) && item.word[2] !== targetMeaning) {
          distractors.push(item.word[2]);
          if (distractors.length >= 6) break;
        }
      }
    }

    while (distractors.length < 6) {
      const rand = candidates[Math.floor(Math.random() * candidates.length)];
      const val = (quizType === 1) ? rand[1] : rand[2];
      const correctVal = (quizType === 1) ? targetReading : targetMeaning;
      if (!distractors.includes(val) && val !== correctVal) {
        distractors.push(val);
      }
    }

    return distractors;
  }

  function loadQuestion() {
    if (currentIndex >= currentPool.length) {
      document.getElementById("finishSummary").innerText = 
        `총 ${currentPool.length}단어를 중복 없이 1회독 완료했습니다!`;
      showScreen("finishScreen");
      return;
    }

    currentWord = currentPool[currentIndex];
    const [kanji, reading, meaning] = currentWord;

    const progressPct = ((currentIndex) / currentPool.length) * 100;
    document.getElementById("progressBar").style.width = `${progressPct}%`;

    const badge = document.getElementById("promptTypeBadge");
    const prompt = document.getElementById("promptWord");
    let correctAnswer = "";

    if (selectedQuizType === 1) {
      badge.innerText = `[유형 1] 발음(히라가나) 맞추기 (${currentIndex + 1}/${currentPool.length})`;
      prompt.innerText = kanji;
      correctAnswer = reading;
    } else if (selectedQuizType === 2) {
      badge.innerText = `[유형 2] 한자 ➔ 한국어 뜻 맞추기 (${currentIndex + 1}/${currentPool.length})`;
      prompt.innerText = kanji;
      correctAnswer = meaning;
    } else {
      badge.innerText = `[유형 3] 발음 ➔ 한국어 뜻 맞추기 (${currentIndex + 1}/${currentPool.length})`;
      prompt.innerText = reading;
      correctAnswer = meaning;
    }

    document.getElementById("detailCard").classList.remove("show");
    document.getElementById("nextBtn").style.display = "none";

    const distractors = getSmartDistractors(currentWord, selectedQuizType);
    const shuffledOptions = shuffle([correctAnswer, ...distractors]);

    const optContainer = document.getElementById("optionsContainer");
    optContainer.innerHTML = "";

    // 1~7번 보기
    shuffledOptions.forEach((optText, i) => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerHTML = `<span class="num">${i + 1}.</span> <span>${optText}</span>`;
      btn.onclick = () => checkAnswer(btn, optText, correctAnswer, false);
      optContainer.appendChild(btn);
    });

    // 8번 보기: 모르겠어요
    const unknownBtn = document.createElement("button");
    unknownBtn.className = "opt-btn unknown-btn";
    unknownBtn.innerHTML = `<span class="num">8.</span> <span>❓ 모르겠어요</span>`;
    unknownBtn.onclick = () => checkAnswer(unknownBtn, "__UNKNOWN__", correctAnswer, true);
    optContainer.appendChild(unknownBtn);
  }

  function checkAnswer(selectedBtn, selectedText, correctText, isUnknown) {
    const allButtons = document.querySelectorAll(".opt-btn");
    allButtons.forEach(b => b.disabled = true);

    const [kanji, reading, meaning] = currentWord;
    const isCorrect = !isUnknown && (selectedText === correctText);

    if (isCorrect) {
      selectedBtn.classList.add("correct");
    } else {
      if (isUnknown) {
        selectedBtn.classList.add("selected-unknown");
      } else {
        selectedBtn.classList.add("wrong");
      }
      allButtons.forEach(b => {
        if (b.innerText.includes(correctText)) {
          b.classList.add("correct");
        }
      });
      recordWrong(currentWord.id);
    }

    // 상세 카드 정보 채우기
    document.getElementById("detailKanji").innerText = kanji;
    
    // 한국식 한자 훈음 파싱 및 표시
    const hanjaMeanings = getHanjaMeanings(kanji);
    const hanjaBox = document.getElementById("detailHanjaBox");
    if (hanjaMeanings) {
      document.getElementById("detailHanjaMeaning").innerText = hanjaMeanings;
      hanjaBox.style.display = "flex";
    } else {
      hanjaBox.style.display = "none";
    }

    document.getElementById("detailReading").innerText = reading;
    document.getElementById("detailMeaning").innerText = meaning;
    document.getElementById("detailCard").classList.add("show");

    document.getElementById("nextBtn").style.display = "block";
  }

  function nextQuestion() {
    currentIndex++;
    loadQuestion();
  }

  // 초기 실행
  initTheme();
  updateCountsUI();
</script>
